<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Puzzle</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f4f4;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    #root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .title-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: #2c3e50;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      line-height: 56px;
      text-align: center;
      letter-spacing: 2px;
      z-index: 10;
    }

    .toolbar {
      position: absolute;
      top: 56px;
      left: 0;
      width: 100%;
      height: 48px;
      background: #ecf0f1;
      border-bottom: 1px solid #bdc3c7;
      z-index: 10;
    }

    .toolbar button {
      position: absolute;
      top: 8px;
      height: 32px;
      padding: 0 18px;
      border: 1px solid #95a5a6;
      border-radius: 4px;
      background: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      color: #2c3e50;
    }

    .toolbar button:hover {
      background: #dfe6e9;
    }

    .toolbar .btn-check {
      left: 20px;
    }

    .toolbar .btn-reveal {
      left: 130px;
    }

    .toolbar .btn-clear {
      left: 250px;
    }

    .toolbar .timer {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 18px;
      font-weight: 600;
      color: #2c3e50;
      line-height: 28px;
    }

    .grid-container {
      position: absolute;
      top: 120px;
      left: 30px;
      background: #000;
    }

    .cell {
      position: absolute;
      width: 34px;
      height: 34px;
      background: #fff;
      border: 1px solid #333;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      line-height: 34px;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    .cell.black {
      background: #2c3e50;
      cursor: default;
    }

    .cell.selected {
      background: #f9e547;
    }

    .cell.highlighted {
      background: #b8d4f0;
    }

    .cell.selected.highlighted {
      background: #f9e547;
    }

    .cell.checked-wrong {
      color: #e74c3c;
    }

    .cell.revealed {
      color: #27ae60;
    }

    .cell-number {
      position: absolute;
      top: 1px;
      left: 2px;
      font-size: 9px;
      font-weight: 600;
      line-height: 9px;
      color: #333;
      pointer-events: none;
    }

    .cell-letter {
      position: absolute;
      top: 6px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      pointer-events: none;
    }

    .selected-clue-bar {
      position: absolute;
      left: 30px;
      background: #ffeaa7;
      border: 1px solid #fdcb6e;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      color: #2d3436;
      line-height: 36px;
      padding-left: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .clues-panel {
      position: absolute;
      top: 120px;
      left: 280px;
      width: 380px;
      height: 400px;
      background: #fff;
      border: 1px solid #bdc3c7;
      border-radius: 4px;
      overflow: hidden;
    }

    .clues-across {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      overflow-y: auto;
    }

    .clues-down {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 50%;
      overflow-y: auto;
      border-top: 2px solid #bdc3c7;
    }

    .clue-heading {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 32px;
      background: #2c3e50;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 32px;
      padding-left: 12px;
      z-index: 5;
    }

    .clue-item {
      padding: 4px 12px;
      font-size: 13px;
      cursor: pointer;
      color: #2d3436;
    }

    .clue-item:hover {
      background: #dfe6e9;
    }

    .clue-item.active {
      background: #ffeaa7;
      font-weight: 700;
    }

    .clue-number {
      font-weight: 700;
      margin-right: 4px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const SOLUTION = [
      ['A', 'T', null, 'D', 'O'],
      ['T', 'A', 'P', 'E', 'S'],
      [null, 'P', 'E', 'A', null],
      ['B', 'E', 'A', 'T', 'S'],
      ['E', 'R', null, 'H', 'E'],
    ];

    const NUMBERS = [
      [1, 2, 0, 3, 4],
      [5, 0, 6, 0, 0],
      [0, 7, 0, 0, 0],
      [8, 0, 0, 0, 0],
      [9, 0, 0, 10, 0],
    ];

    const CLUES_ACROSS = [
      { num: 1, text: "In contact with" },
      { num: 3, text: "Perform" },
      { num: 5, text: "Cassette strips" },
      { num: 7, text: "Small green vegetable" },
      { num: 8, text: "Hits rhythmically" },
      { num: 9, text: "Hesitation sound" },
      { num: 10, text: "Male pronoun" },
    ];

    const CLUES_DOWN = [
      { num: 1, text: "In contact with" },
      { num: 2, text: "Narrows gradually" },
      { num: 3, text: "The end of life" },
      { num: 4, text: "Computer platform, for short" },
      { num: 6, text: "Green vegetable in a pod" },
      { num: 8, text: "Exist" },
      { num: 10, text: "Southeast, briefly" },
    ];

    const ROWS = SOLUTION.length;
    const COLS = SOLUTION[0].length;
    const STEP = 36;
    const CELL = 34;
    const GRID_WIDTH = COLS * STEP + 2;
    const GRID_HEIGHT = ROWS * STEP + 2;

    function buildWordMap() {
      const across = {};
      const down = {};

      for (let r = 0; r < ROWS; r++) {
        let c = 0;
        while (c < COLS) {
          if (SOLUTION[r][c] === null) {
            c++;
            continue;
          }
          const start = c;
          const cells = [];
          while (c < COLS && SOLUTION[r][c] !== null) {
            cells.push([r, c]);
            c++;
          }
          if (cells.length > 1) {
            const num = NUMBERS[r][start];
            if (num > 0) across[num] = cells;
          }
        }
      }

      for (let c = 0; c < COLS; c++) {
        let r = 0;
        while (r < ROWS) {
          if (SOLUTION[r][c] === null) {
            r++;
            continue;
          }
          const start = r;
          const cells = [];
          while (r < ROWS && SOLUTION[r][c] !== null) {
            cells.push([r, c]);
            r++;
          }
          if (cells.length > 1) {
            const num = NUMBERS[start][c];
            if (num > 0) down[num] = cells;
          }
        }
      }

      return { across, down };
    }

    const WORD_MAP = buildWordMap();

    function findWordForCell(r, c, direction) {
      const map = direction === 'across' ? WORD_MAP.across : WORD_MAP.down;
      for (const num in map) {
        const cells = map[num];
        for (const [cr, cc] of cells) {
          if (cr === r && cc === c) {
            return { num: parseInt(num, 10), cells };
          }
        }
      }
      return null;
    }

    function Cell({
      row,
      col,
      letter,
      number,
      isBlack,
      isSelected,
      isHighlighted,
      status,
      onClick
    }) {
      if (isBlack) {
        const style = {
          position: 'absolute',
          left: col * STEP + 1,
          top: row * STEP + 1,
          width: CELL,
          height: CELL,
          background: '#2c3e50',
        };
        return React.createElement('div', { style, className: 'cell black' });
      }

      let cls = 'cell';
      if (isSelected) cls += ' selected';
      else if (isHighlighted) cls += ' highlighted';
      if (status === 'wrong') cls += ' checked-wrong';
      if (status === 'revealed') cls += ' revealed';

      const style = {
        position: 'absolute',
        left: col * STEP + 1,
        top: row * STEP + 1,
        width: CELL,
        height: CELL,
      };

      return React.createElement(
        'div',
        { className: cls, style, onClick },
        number > 0 && React.createElement('span', { className: 'cell-number' }, number),
        React.createElement('span', { className: 'cell-letter' }, letter || '')
      );
    }

    function Grid({ grid, cellStates, selectedCell, highlightedCells, onCellClick }) {
      const cells = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const isBlack = SOLUTION[r][c] === null;
          const isSel = selectedCell && selectedCell[0] === r && selectedCell[1] === c;
          const isHL = highlightedCells.some(([hr, hc]) => hr === r && hc === c);

          cells.push(
            React.createElement(Cell, {
              key: `${r}-${c}`,
              row: r,
              col: c,
              letter: grid[r][c],
              number: NUMBERS[r][c],
              isBlack,
              isSelected: isSel,
              isHighlighted: isHL,
              status: cellStates[r][c],
              onClick: () => !isBlack && onCellClick(r, c),
            })
          );
        }
      }

      return React.createElement('div', {
        className: 'grid-container',
        style: {
          width: GRID_WIDTH,
          height: GRID_HEIGHT,
        }
      }, cells);
    }

    function ClueList({ title, clues, activeNum, onClueClick, className }) {
      return React.createElement(
        'div',
        { className },
        React.createElement('div', { className: 'clue-heading' }, title),
        clues.map(cl =>
          React.createElement(
            'div',
            {
              key: cl.num,
              className: 'clue-item' + (activeNum === cl.num ? ' active' : ''),
              onClick: () => onClueClick(cl.num),
            },
            React.createElement('span', { className: 'clue-number' }, cl.num + '.'),
            ' ' + cl.text
          )
        )
      );
    }

    function Toolbar({ onCheck, onReveal, onClear, seconds }) {
      const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
      const ss = String(seconds % 60).padStart(2, '0');

      return React.createElement(
        'div',
        { className: 'toolbar' },
        React.createElement('button', { className: 'btn-check', onClick: onCheck }, 'Check'),
        React.createElement('button', { className: 'btn-reveal', onClick: onReveal }, 'Reveal'),
        React.createElement('button', { className: 'btn-clear', onClick: onClear }, 'Clear'),
        React.createElement('span', { className: 'timer' }, mm + ':' + ss)
      );
    }

    function SelectedClueBar({ direction, wordInfo }) {
      if (!wordInfo) {
        return React.createElement('div', {
          className: 'selected-clue-bar',
          style: {
            top: 120 + GRID_HEIGHT + 14,
            width: GRID_WIDTH,
            height: 36,
          }
        }, '\u00A0');
      }

      const clueList = direction === 'across' ? CLUES_ACROSS : CLUES_DOWN;
      const clue = clueList.find(c => c.num === wordInfo.num);
      const label = wordInfo.num + ' ' + direction.charAt(0).toUpperCase() + direction.slice(1);

      return React.createElement(
        'div',
        {
          className: 'selected-clue-bar',
          style: {
            top: 120 + GRID_HEIGHT + 14,
            width: GRID_WIDTH,
            height: 36,
          }
        },
        label + ': ' + (clue ? clue.text : '')
      );
    }

    function App() {
      const [grid, setGrid] = React.useState(() => {
        const g = [];
        for (let r = 0; r < ROWS; r++) {
          g.push(new Array(COLS).fill(''));
        }
        return g;
      });

      const [cellStates, setCellStates] = React.useState(() => {
        const s = [];
        for (let r = 0; r < ROWS; r++) {
          s.push(new Array(COLS).fill(null));
        }
        return s;
      });

      const [selectedCell, setSelectedCell] = React.useState([0, 0]);
      const [direction, setDirection] = React.useState('across');
      const [seconds, setSeconds] = React.useState(0);
      const [running, setRunning] = React.useState(true);

      React.useEffect(() => {
        if (!running) return;
        const id = setInterval(() => setSeconds(s => s + 1), 1000);
        return () => clearInterval(id);
      }, [running]);

      const wordInfo = findWordForCell(selectedCell[0], selectedCell[1], direction);
      const highlightedCells = wordInfo ? wordInfo.cells : [];

      React.useEffect(() => {
        if (!wordInfo) {
          const other = direction === 'across' ? 'down' : 'across';
          const alt = findWordForCell(selectedCell[0], selectedCell[1], other);
          if (alt) setDirection(other);
        }
      }, [selectedCell, direction, wordInfo]);

      function handleCellClick(r, c) {
        if (selectedCell[0] === r && selectedCell[1] === c) {
          const newDir = direction === 'across' ? 'down' : 'across';
          const alt = findWordForCell(r, c, newDir);
          if (alt) setDirection(newDir);
        } else {
          setSelectedCell([r, c]);
        }
      }

      function handleClueClick(num, dir) {
        const map = dir === 'across' ? WORD_MAP.across : WORD_MAP.down;
        const cells = map[num];
        if (cells) {
          setDirection(dir);
          setSelectedCell(cells[0]);
        }
      }

      function moveTo(r, c) {
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS && SOLUTION[r][c] !== null) {
          setSelectedCell([r, c]);
        }
      }

      function advanceCursor() {
        const [r, c] = selectedCell;

        if (direction === 'across') {
          for (let nc = c + 1; nc < COLS; nc++) {
            if (SOLUTION[r][nc] !== null) {
              setSelectedCell([r, nc]);
              return;
            }
          }
        } else {
          for (let nr = r + 1; nr < ROWS; nr++) {
            if (SOLUTION[nr][c] !== null) {
              setSelectedCell([nr, c]);
              return;
            }
          }
        }
      }

      function retreatCursor() {
        const [r, c] = selectedCell;

        if (direction === 'across') {
          for (let nc = c - 1; nc >= 0; nc--) {
            if (SOLUTION[r][nc] !== null) {
              setSelectedCell([r, nc]);
              return;
            }
          }
        } else {
          for (let nr = r - 1; nr >= 0; nr--) {
            if (SOLUTION[nr][c] !== null) {
              setSelectedCell([nr, c]);
              return;
            }
          }
        }
      }

      function cycleClue(forward) {
        const map = direction === 'across' ? WORD_MAP.across : WORD_MAP.down;
        const nums = Object.keys(map).map(Number).sort((a, b) => a - b);
        const curNum = wordInfo ? wordInfo.num : nums[0];
        const idx = nums.indexOf(curNum);
        let nextIdx;

        if (forward) {
          nextIdx = idx + 1;
          if (nextIdx >= nums.length) {
            const otherDir = direction === 'across' ? 'down' : 'across';
            const otherMap = otherDir === 'across' ? WORD_MAP.across : WORD_MAP.down;
            const otherNums = Object.keys(otherMap).map(Number).sort((a, b) => a - b);
            setDirection(otherDir);
            setSelectedCell(otherMap[otherNums[0]][0]);
            return;
          }
        } else {
          nextIdx = idx - 1;
          if (nextIdx < 0) {
            const otherDir = direction === 'across' ? 'down' : 'across';
            const otherMap = otherDir === 'across' ? WORD_MAP.across : WORD_MAP.down;
            const otherNums = Object.keys(otherMap).map(Number).sort((a, b) => a - b);
            setDirection(otherDir);
            setSelectedCell(otherMap[otherNums[otherNums.length - 1]][0]);
            return;
          }
        }

        setSelectedCell(map[nums[nextIdx]][0]);
      }

      React.useEffect(() => {
        function handleKey(e) {
          const [r, c] = selectedCell;

          if (e.key === 'ArrowRight') {
            e.preventDefault();
            setDirection('across');
            moveTo(r, c + 1);
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setDirection('across');
            moveTo(r, c - 1);
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            setDirection('down');
            moveTo(r + 1, c);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setDirection('down');
            moveTo(r - 1, c);
          } else if (e.key === 'Tab') {
            e.preventDefault();
            cycleClue(!e.shiftKey);
          } else if (e.key === 'Backspace') {
            e.preventDefault();
            if (grid[r][c]) {
              const newGrid = grid.map(row => [...row]);
              newGrid[r][c] = '';
              const newStates = cellStates.map(row => [...row]);
              newStates[r][c] = null;
              setGrid(newGrid);
              setCellStates(newStates);
            } else {
              retreatCursor();
            }
          } else if (/^[a-zA-Z]$/.test(e.key)) {
            e.preventDefault();
            const newGrid = grid.map(row => [...row]);
            newGrid[r][c] = e.key.toUpperCase();
            const newStates = cellStates.map(row => [...row]);
            newStates[r][c] = null;
            setGrid(newGrid);
            setCellStates(newStates);
            advanceCursor();
          }
        }

        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [selectedCell, direction, grid, cellStates, wordInfo]);

      function handleCheck() {
        if (!wordInfo) return;
        const newStates = cellStates.map(row => [...row]);
        for (const [cr, cc] of wordInfo.cells) {
          if (grid[cr][cc]) {
            if (grid[cr][cc] !== SOLUTION[cr][cc]) {
              newStates[cr][cc] = 'wrong';
            }
          }
        }
        setCellStates(newStates);
      }

      function handleReveal() {
        if (!wordInfo) return;
        const newGrid = grid.map(row => [...row]);
        const newStates = cellStates.map(row => [...row]);
        for (const [cr, cc] of wordInfo.cells) {
          newGrid[cr][cc] = SOLUTION[cr][cc];
          newStates[cr][cc] = 'revealed';
        }
        setGrid(newGrid);
        setCellStates(newStates);
      }

      function handleClear() {
        const newGrid = grid.map(row => [...row]);
        const newStates = cellStates.map(row => [...row]);
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            newGrid[r][c] = '';
            newStates[r][c] = null;
          }
        }
        setGrid(newGrid);
        setCellStates(newStates);
        setSeconds(0);
      }

      return React.createElement(
        React.Fragment,
        null,
        React.createElement('div', { className: 'title-bar' }, 'CROSSWORD PUZZLE'),
        React.createElement(Toolbar, {
          onCheck: handleCheck,
          onReveal: handleReveal,
          onClear: handleClear,
          seconds,
        }),
        React.createElement(Grid, {
          grid,
          cellStates,
          selectedCell,
          highlightedCells,
          onCellClick: handleCellClick,
        }),
        React.createElement(SelectedClueBar, { direction, wordInfo }),
        React.createElement(
          'div',
          { className: 'clues-panel' },
          React.createElement(ClueList, {
            title: 'ACROSS',
            clues: CLUES_ACROSS,
            activeNum: direction === 'across' && wordInfo ? wordInfo.num : -1,
            onClueClick: (n) => handleClueClick(n, 'across'),
            className: 'clues-across',
          }),
          React.createElement(ClueList, {
            title: 'DOWN',
            clues: CLUES_DOWN,
            activeNum: direction === 'down' && wordInfo ? wordInfo.num : -1,
            onClueClick: (n) => handleClueClick(n, 'down'),
            className: 'clues-down',
          })
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>

</html>
